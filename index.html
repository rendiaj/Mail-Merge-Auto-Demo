<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Ads Desktop Wrapper Container</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #carbonads {
            display: block;
            overflow: hidden;
            max-width: 300px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 10px;
            box-sizing: border-box;
        }
        #carbonads a {
            color: #333333;
            text-decoration: none;
        }
        #carbonads .carbon-wrap {
            display: flex;
            flex-direction: column;
        }
        .carbon-img {
            display: block;
            margin-bottom: 8px;
            line-height: 1;
        }
        .carbon-img img {
            display: block;
            margin: 0 auto;
            border: 0;
        }
        .carbon-text {
            display: block;
            text-align: left;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .carbon-poweredby {
            display: block;
            text-align: left;
            font-size: 9px;
            color: #999999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <script async src="//cdn.carbonads.com/carbon.js?serve=YOUR_ZONE_ID&placement=YOUR_PLACEMENT_ID" id="_carbonads_js"></script>
</body>
</html>
